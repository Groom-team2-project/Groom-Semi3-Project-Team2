name: moigo

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: moigo-backend:${IMAGE_TAG:-latest}
    container_name: moigo-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      # 호스트에서 실행할 때 쓰는 DB_URL과 컨테이너용 주소를 분리합니다.
      DB_URL: ${COMPOSE_DB_URL:-jdbc:mysql://mysql:3306/moigo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    networks:
      - moigo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mysql:
    image: mysql:8.4
    container_name: moigo-mysql
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      MYSQL_DATABASE: moigo
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul

    expose:
      - "3306"
    volumes:
      - moigo_mysql_data:/var/lib/mysql
    networks:
      - moigo-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  moigo_mysql_data:

networks:
  moigo-network:
    driver: bridge
