name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  backend:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Run backend tests
        env:
          SPRING_PROFILES_ACTIVE: test
          KAKAO_LOCAL_REST_API_KEY: dummy-ci-key
        run: ./gradlew clean test

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint # 코드 품질 검사
        run: npm run lint

      - name: Build frontend
        env:
          BACKEND_URL: http://localhost:8080
          NEXT_PUBLIC_API_BASE_URL: ""
        run: npm run build

  deploy:
    name: Deploy Backend to EC2
    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: ${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2.1.6

      - name: Build and push backend image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR.REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          set -Eeuo pipefall
          
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --tag "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          
          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Deploy to EC2 with SSM
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -Eeuo pipefall
          
          PARAMETERS="$(
            jq -cn \
              --arg command "sudo /opt/moigo/deploy.sh ${IMAGE_URI} ${DEPLOY_REGION}" \
              '{commands: [$command]}'
          )"

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "${INSTANCE_ID}" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy moigo backend ${GITHUB_SHA}" \
              --parameters "${PARAMETERS}" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM command: ${COMMAND_ID}"

          STATUS="Pending"

          for attempt in $(seq 1 90); do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "Status" \
                --output text 2>/dev/null || true
            )"

            echo "Deployment ${attempt}/90: ${STATUS:-Pending}"

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{
              Status: Status,
              StandardOutput: StandardOutputContent,
              StandardError: StandardErrorContent
            }' \
            --output json

          if [[ "${STATUS}" != "Success" ]]; then
            echo "EC2 deployment failed: ${STATUS}"
            exit 1
          fi
