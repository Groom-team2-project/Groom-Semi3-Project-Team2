# ===================================================================
# 1. 공통 및 로컬 개발 환경 설정
# ===================================================================
spring:
  application:
    name: moigo
  datasource:
    url: ${DB_URL:jdbc:h2:mem:moigo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-dummy-secret-change-me}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION:3600}
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION:1209600}
  oauth:
    cookie-secure: ${OAUTH_COOKIE_SECURE:false}

kakao:
  local:
    rest-api-key: ${KAKAO_LOCAL_REST_API_KEY:dummy-kakao-local-rest-api-key}
  oauth:
    client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
    client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}

server:
  port: ${SERVER_PORT:8080}

# -------------------------------------------------------------------
# Actuator 헬스체크 엔드포인트 설정
# -------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

---
# ===================================================================
# 2. 운영 환경 설정 (AWS RDS & Docker/EC2 배포용)
# ===================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET}
  oauth:
    cookie-secure: ${OAUTH_COOKIE_SECURE:true}

kakao:
  oauth:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

---
# ===================================================================
# 3. RDS TLS 설정
# ===================================================================
spring:
  config:
    activate:
      on-profile: rds
    import: configtree:/run/secrets/
  datasource:
    hikari:
      data-source-properties:
        trustCertificateKeyStoreUrl: file:/app/certs/rds-truststore.p12
        trustCertificateKeyStoreType: PKCS12
        fallbackToSystemTrustStore: false

---
# ===================================================================
# 4. Gradle test 및 CI 환경을 위한 테스트 전용
# ===================================================================
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:moigo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: none
