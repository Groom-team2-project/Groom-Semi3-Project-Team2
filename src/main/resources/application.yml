spring:
  application:
    name: moigo
  datasource:
    url: ${DB_URL:jdbc:h2:mem:moigo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# TODO:
# JWT Secret, 토큰 만료 시간, 카카오 관련 id, secret, redirect-uri 설정
app:
  jwt:
    secret:
    access-token-expiration-seconds:
    refresh-token-expiration-seconds:

kakao:
  oauth:
    client-id:
    client-secret:
    redirect-uri:

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

server:
  port: ${SERVER_PORT:8080}
