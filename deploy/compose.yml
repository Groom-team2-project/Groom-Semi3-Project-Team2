name: moigo

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: moigo-backend
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: prod,rds
      SERVER_PORT: 8080
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JPA_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-3600}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-1209600}
      OAUTH_COOKIE_SECURE: ${OAUTH_COOKIE_SECURE:-true}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:?KAKAO_CLIENT_ID is required}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:?KAKAO_CLIENT_SECRET is required}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:?KAKAO_REDIRECT_URI is required}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:?KAKAO_REST_API_KEY is required}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL is required}
      TZ: Asia/Seoul
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - moigo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - /opt/moigo/certs/rds-truststore.p12:/app/certs/rds-truststore.p12:ro
    secrets:
      - source: rds_truststore_password
        target: spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword

volumes:
  moigo_mysql_data:

networks:
  moigo-network:
    driver: bridge

secrets:
  rds_truststore_password:
    file: /opt/moigo/secrets/rds_truststore_password
